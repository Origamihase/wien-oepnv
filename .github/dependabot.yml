# Configuration for Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions: SHA-gepinnte Actions werden mit jedem neuen Tag-Release
  # automatisch als PR aktualisiert. Den Kommentar hinter dem SHA schreibt
  # Dependabot nur um, wenn er die bisherige volle Version nennt
  # ("# v4.36.2" -> "# v4.39.1", #2102); ein Kommentar mit nur der
  # Hauptversion bleibt stehen ("# v6" auf setup-python 7.1.0, #2105). Jeder
  # Pin trägt deshalb "# vX.Y.Z" (tests/test_workflow_action_pins.py).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    open-pull-requests-limit: 5
    # CodeQL ``init``, ``analyze`` und ``upload-sarif`` stammen aus einem
    # Repository und müssen auf demselben Stand laufen. Einzeln geöffnet
    # (#1773 hob nur ``analyze``) wird der CodeQL-Check rot; die Gruppe
    # bündelt sie in einem PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # pip: aktualisiert Python-Dependencies (requirements.txt, requirements-dev.txt,
  # pyproject.toml) im selben monatlichen Schedule wie github-actions.
  # Sicherheitsupdates fließen separat über Dependabot Security Advisories.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
