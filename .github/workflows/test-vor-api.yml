name: Test VOR API

on:
  workflow_dispatch:
  push:
    # Narrowed 2026-09-13 (audit A.1). The previous ``scripts/**`` filter
    # matched ~40 files, so any push touching an unrelated helper fired a real
    # VAO ``location.name`` request. Only the paths that can actually change
    # VOR behaviour belong here.
    paths:
      - "src/providers/vor.py"
      - "scripts/update_stammstrecke_hbf.py"
      - "scripts/update_stammstrecke_status.py"
      - "scripts/verify_vor_access_id.py"
      - "scripts/check_vor_auth.py"
      - "scripts/preflight_quota_check.py"
      - ".github/workflows/test-vor-api.yml"

permissions:
  contents: read

# Audit A.1: the smoke test below spends real VAO budget, so it must queue
# behind every other quota-bound job instead of racing them. ``update-cycle``,
# ``build-feed`` and ``manual-full-refresh`` already share this group; this
# workflow sat outside it and could run concurrently with a Stammstrecke tick.
concurrency:
  group: external-api-fetch
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Defense-in-depth ceiling. The VOR /location.name smoke test itself is
    # under a minute, but the final ``pytest -q`` step re-runs the FULL suite
    # (~8000 tests) with the VOR secrets present, which — like the "Run test
    # suite" job in test.yml — takes well over 10 min on a GH runner and was
    # being cancelled at the cap. Match test.yml's 20-min budget (the per-test
    # pytest-timeout of 60 s still catches genuine hangs). Without the cap the
    # workflow inherits GitHub's 360-min default.
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
      VOR_ACCESS_ID: ${{ secrets.VOR_ACCESS_ID }}
      VOR_BASE_URL: ${{ secrets.VOR_BASE_URL }}

    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Validate required secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          # ``exit 78`` does NOT produce a neutral/skipped status for a shell
          # ``run:`` step (that code only signalled "neutral" for the legacy
          # container/JS Action mechanism); any non-zero exit hard-FAILS the
          # job. Emit a flag instead and gate the downstream steps on it so a
          # secrets-less run (e.g. a fork) skips cleanly with a green job.
          if [[ -z "${VOR_ACCESS_ID:-}" || -z "${VOR_BASE_URL:-}" ]]; then
            echo "VOR_ACCESS_ID oder VOR_BASE_URL fehlt -> Tests werden übersprungen."
            echo "Hinweis: Ohne konfigurierte Secrets (z. B. in Forks) stehen diese Werte nicht zur Verfügung."
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.secrets.outputs.have_secrets == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.secrets.outputs.have_secrets == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Audit A.1 gate: refuse to spend a VAO slot the committed counter says
      # we do not have. Reads data/vor_request_count.json from the checkout,
      # so it sees whatever the last update-cycle tick committed.
      - name: VAO quota pre-flight
        id: preflight
        if: steps.secrets.outputs.have_secrets == 'true'
        run: python scripts/preflight_quota_check.py --check vor --margin 1

      - name: Smoke test VOR endpoint
        if: >-
          steps.secrets.outputs.have_secrets == 'true' &&
          steps.preflight.outputs.quota_ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Audit A.1: this replaces a raw ``curl`` that interpolated
          # ``accessId=${VOR_ACCESS_ID}`` straight onto the command line. The
          # helper issues the same ``location.name`` probe, but through
          # ``src.providers.vor`` — so the request is charged against the
          # 100/day budget via ``reserve_request_slot`` (the curl was entirely
          # invisible to the counter), carries the SSRF/host-pinning checks in
          # ``fetch_content_safe``, and keeps the credential out of the process
          # command line and out of any error text.
          set +e
          python scripts/verify_vor_access_id.py
          rc=$?
          set -e
          case "$rc" in
            0) echo "location.name -> OK (credentials accepted)" ;;
            3) echo "location.name -> SKIPPED (VAO daily budget exhausted)" ;;
            *) echo "location.name -> FAILED (exit ${rc})" ;;
          esac | tee vor_api_status.txt
          # Exit 3 (budget exhausted) is not a credential fault — do not fail
          # the job over it, the pre-flight already reported the budget state.
          if [ "$rc" != "0" ] && [ "$rc" != "3" ]; then
            exit "$rc"
          fi

      - name: Upload VOR API Status
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vor-api-status
          path: vor_api_status.txt
          retention-days: 1

      - name: Run pytest
        if: steps.secrets.outputs.have_secrets == 'true'
        run: pytest -q
