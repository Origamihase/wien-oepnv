name: Complexity gate (C901 allowlist)

# Mirrors the structure of mypy-strict.yml: an allowlist baseline
# (.c901-baseline.txt) records every function in src/ and scripts/ above
# the C901 threshold (15) as ``<path>::<function> <complexity>``. The gate
# fails on any difference between that file and ruff's measurement: a NEW
# violation, a baselined function that got more complex, and since
# 2026-11-01 also one that got simpler or dropped to 15 or less (the
# improvement is locked in by regenerating the baseline in the same
# change, see scripts/check_complexity.py). It also fails when ruff
# cannot measure.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: complexity-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c901-gate:
    name: C901 complexity gate (max 15 for new code)
    runs-on: ubuntu-latest
    # Defense-in-depth ceiling: the C901 gate is one ruff run over src/ and
    # scripts/ (~70 kLOC); it completes in under a minute.
    # 5 min gives ~5x headroom over the worst observed runtime while
    # catching hangs quickly. Without the cap the workflow inherits
    # GitHub's 360-min default. Mirrors the canonical defence shape
    # established in update-cycle.yml.
    timeout-minutes: 5

    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          requirements: requirements-dev.txt

      - name: Run C901 gate
        run: python scripts/check_complexity.py
