name: Takt-Fallback

# Fallback for the 30-minute cadence of the feed. IFTTT starts the Update
# cycle (``repository_dispatch``) because GitHub's own cron starts late and
# skips most slots here; this workflow steps in only when IFTTT has not
# ticked for 40 minutes, with the run's own GITHUB_TOKEN (no personal token
# that could expire).
#
# Operator decision Michael 2026-11-04: "Alle 40 Minuten klingt nicht
# schlecht. Sorge aber bitte dafür, dass der Fallback wirklich nur läuft,
# wenn IFTTT nicht funktioniert hat. Wenn IFTTT nicht funktioniert erstelle
# einen Issue. Wenn der Fallback auch nicht funktioniert, und der Feed nicht
# mehr aktualisiert werden kann, mach den Health Check rot." Same day:
# "Effizienz ist mir wichtig. Das Projekt soll ressourcenschonend arbeiten."
#
# How: every Update cycle run on main starts one check (``requested``).
# GitHub holds it back for 40 minutes with the wait timer of the environment
# ``takt-wartezeit`` (Settings → Environments; Wait timer 40 minutes): no
# runner runs during the wait and the wait is not billed. The check of the
# next Update cycle run cancels the waiting one (``cancel-in-progress``), so
# while IFTTT ticks every 30 minutes no check reaches a runner. A check that
# does run found no Update cycle run for 40 minutes: it starts one, opens the
# issue ``ifttt-ausfall`` and starts its successor (the next check in 40
# minutes). The next IFTTT run closes the issue (step in update-cycle.yml).
# A fallback run that fails starts the Health check, whose check "Takt" turns
# red when IFTTT is silent and the feed has had no new build for 80 minutes.
# Runs started by the bot mail nobody, so the check also comments on the
# issue once when the fallback fails and once when it runs again (Michael
# 2026-11-04, card "Ja, Kommentar im Issue").
# Details: src/takt_fallback.py, docs/development-teil-4.md ("Geplante
# Läufe").
#
# The schedule below restarts the watch should the chain ever break (GitHub
# delivers it late, which is fine for a restart). It runs in a lane of its
# own so that it never cancels a waiting check, and acts only when no check
# is waiting.

on:
  workflow_run:
    workflows: ["Update cycle"]
    types: [requested]
    branches: [main]
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One waiting check at a time: the check of a newer Update cycle run
# replaces it. The schedule has its own lane (see above).
concurrency:
  group: ${{ github.event_name == 'schedule' && 'takt-fallback-zeitplan' || 'takt-fallback' }}
  cancel-in-progress: true

jobs:
  check:
    name: Nach 40 Minuten prüfen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The 40-minute wait happens before the job starts (wait timer of the
    # environment), without a runner. ``deployment: false``: no deployment
    # record per tick.
    environment:
      name: takt-wartezeit
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
      # Start update-cycle.yml, health-check.yml and its own successor
      # (workflow_dispatch) and read the Update cycle runs.
      actions: write
      # Open and close the issue "ifttt-ausfall".
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6). Two attempts; remove once v6.0.3+ is pinned. Mirrors the
      # other workflows.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Step in when IFTTT has been silent for 40 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$SCHEDULED" = "true" ]; then
            python scripts/takt_fallback.py --schedule
          else
            python scripts/takt_fallback.py
          fi
