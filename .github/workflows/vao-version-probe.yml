name: VAO version probe (temporary)

# One-off probe for the VAO version upgrade; removed before merge.
# Sends the same /departureBoard query to v1.11.0, v1.12.0 and v1.13.0
# (three VAO requests in total) and commits the parsed result to probe/out/.
on:
  push:
    branches:
      - 'claude/project-thread-6a03y7'
    paths:
      - 'probe/RUN'

permissions:
  contents: write

concurrency:
  group: external-api-fetch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      VOR_ACCESS_ID: ${{ secrets.VOR_ACCESS_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: ./.github/actions/install-deps
      - name: Probe
        run: python probe/vao_version_probe.py "probe/out/$(cat probe/RUN).json"
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git commit -m "probe: VAO version results [skip ci]"
          for i in 1 2 3 4; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 5)); git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
