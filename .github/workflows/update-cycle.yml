name: Update cycle

# Single-job sequential pipeline. One cycle tick runs every fetcher
# + the feed composer + the README/stats render in a single runner
# with shared workspace, then emits ONE commit covering every
# output.
#
# Trigger model (since 2026-05-10, commit 55ca72f): IFTTT drives the
# precise cadence; a sparse GitHub-native cron is a safety net only.
#   * IFTTT fires ``repository_dispatch: ifttt_feed_trigger`` on the
#     normal ~30-min cadence (lands close to :00/:30 with less drift
#     than the GH Actions cron tick the project used previously). This
#     is the PRIMARY driver of the 30-min "data + feed" cadence.
#   * Operators press ``Run workflow`` (``workflow_dispatch``) for
#     out-of-band runs.
#   * ``schedule: cron '17 * * * *'`` (hourly, off-cadence minute) is a
#     BACKUP only — it catches a tick that IFTTT missed entirely or a
#     tick that died in the runner setup phase (a first-party action
#     download that cannot be retried from inside the job). It does NOT
#     drive the primary cadence (IFTTT still owns :00/:30) and cannot
#     breach the VAO 100/day budget: the ``preflight_quota_check`` gate
#     skips the quota-bound poll once the daily counter is near the cap.
#     A second guard, the ``Backup-cron freshness gate`` step (see there),
#     makes a backup tick skip all work when a cycle tick already committed
#     within ~35 min, so on healthy days the backup costs ~zero API calls.
#     Without this net, an IFTTT outage would silently freeze
#     the live feed. GitHub delivers this schedule poorly: 157 of ~730
#     hourly ticks between 2026-09-10 and 2026-10-10 arrived, four to seven
#     a day, so during an IFTTT outage the feed would refresh only every
#     few hours (docs/development.md, "Geplante Läufe").
# The weekly station-directory refresh is a separate GitHub-native cron
# in ``update-stations.yml`` (Sundays 01:00 UTC).
#
# Why single-job (replaces the DAG-with-artifacts architecture of
# 2026-05-09, which broke the README cadence): artifacts added two failure
# modes, invalid action SHAs and the ``actions/download-artifact`` glob
# semantics, that silently kept ``build_feed`` from committing. One job has
# no artifact plumbing, no inter-job push race and one commit + resilient
# push at the end (the publish step, last but one), so the visible
# state moves atomically (or not at all); the trade-off is the
# sequential runtime (~3-5 min vs ~2-3 min), fine for the 30-min cadence.
#
# Step order:
#   1. ``actions/checkout`` (depth 1, see the checkout step) +
#      configure the bot git identity once for the whole job
#   2. backup-cron freshness gate — on a ``schedule`` run decide whether a
#      recent tick already covered this window; steps 4-7 gate on its
#      ``should_run`` output (dispatch / manual runs always run)
#   3. ``actions/setup-python`` + venv-cache restore + conditional
#      ``pip install`` on cache miss + prepend ``.venv/bin`` to PATH
#   4. WL / ÖBB / Baustellen cache fetchers (parallel via bash; free APIs)
#   5. VAO quota pre-flight + Stammstrecke poll (gated on counter)
#   6. ``feed build`` reads all caches + the freshly-appended CSV
#      ledger and writes ``docs/feed.xml`` + ``data/first_seen.json``
#      + appends to ``data/stats/stoerungen_<YYYY>.csv`` (step-capped)
#   7. ``generate_markdown_stats.py`` patches the README markers and
#      regenerates ``docs/statistik.md`` (best-effort, continue-on-error:
#      a cosmetic stats failure must NEVER block the feed publish); then
#      ``check_feed_lines.py`` logs the line check and collects its
#      anomalies in ``data/feed_line_anomalies.json`` (same guard)
#   8. ``scripts/feed_watch.py`` (Feed-Wächter) checks the built German
#      feed against its rules and writes ``data/feed_watch.json``, one
#      GitHub issue per broken rule (report only, continue-on-error, never
#      red; docs/reference/feed_watch.md)
#   9. ``scripts/publish_to_main.sh``: validate the built feed XML, then
#      a single ``git commit`` + retrying, never-fail plain ``git push``
#      (reconcile onto concurrent pushes is folded into the push loop; no
#      external commit action — see that step's header for the rationale)
#  10. ``scripts/ki_waechter.py dispatch`` (on ``main``): start the daily
#      KI-Wächter when due (since 2026-11-05; before, its gate ran every tick)
#
# Shell code: the programs of steps 2, 3 (torch), 4 and 7 (statistics) stand
# with their reasoning in ``scripts/cycle/`` (moved on 2026-11-14,
# docs/modularisierung.md). Their steps start them with ``exec bash``, so the
# step's process is the script's shell as before. ``bash <file>`` drops the
# options of the step's shell (``-e``; with ``shell: bash`` also
# ``-o pipefail``): a script whose code ran under them sets them itself; the
# fetch switches ``-e`` off anyway. A step's text comes from the run's commit,
# its script from the checkout (branch tip at job start), as with every
# ``python scripts/...`` step: a script stays usable by the previous step text
# until older runs are through (a renamed one keeps its old path as a one-line
# ``exec bash`` forwarder, a removed one stays unchanged).
#
# Concurrency: the workflow holds the ``external-api-fetch`` lock
# (shared with ``manual-full-refresh.yml`` and ``build-feed.yml`` runs on
# ``main``) so the project never has two
# parallel API-fetching cycles in flight.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ifttt_feed_trigger]
  schedule:
    # Backup safety net only (see "Trigger model" above). Off-cadence
    # minute :17 so it never collides with IFTTT's :00/:30 ticks, and the
    # "Backup-cron freshness gate" step self-skips when a recent tick
    # already ran, so this costs ~zero API calls on healthy days.
    - cron: '17 * * * *'

permissions:
  contents: read

# ``external-api-fetch`` on ``main`` serialises the workflows that write the
# feed and state files there (build-feed.yml, manual-full-refresh.yml);
# test-vor-api.yml writes nothing and has its own lane. A manual start on another branch publishes only to that
# branch and gets its own per-ref lane: GitHub keeps one pending run per
# group and a new pending run cancels it, so a branch run must never sit in
# the lane of a pending ``main`` tick (03.11.2026: a branch push of Test VOR
# API, then still in this group, cancelled the pending rebuild after #2146).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'external-api-fetch' || format('update-cycle-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Defense-in-depth ceiling for the whole job. A healthy tick runs
    # in 3-5 min (see step-order comment above); without this cap the
    # workflow inherits GitHub's 360-min default, so a hung subprocess
    # in any step burns 6h of billable minutes and — combined with
    # ``concurrency: cancel-in-progress: false`` above — backs up the
    # next ~12 IFTTT triggers behind it. 10 min gives ~2x headroom over
    # the worst legitimate run while still catching hangs quickly.
    timeout-minutes: 10
    permissions:
      contents: write
      # Feed-Wächter issues (docs/reference/feed_watch.md, decision 2026-10-11)
      # and closing ``ifttt-ausfall``, which reads the runs (since 2026-11-04).
      issues: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # VOR/VAO API credentials — required by ``scripts/update_stammstrecke_hbf.py``
      # (the active producer; the legacy ``update_stammstrecke_status.py`` remains
      # only the documented rollback target). Without these env vars VAO rejects
      # every request with HTTP 400 (errorText="Missing value for required param accessId").
      VOR_ACCESS_ID: ${{ secrets.VOR_ACCESS_ID }}
      VOR_BASE_URL: ${{ secrets.VOR_BASE_URL }}

    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned.
      #
      # ``ref: github.ref`` checks out the branch as it is when the job
      # starts, not the commit that triggered the run (``github.sha``). The
      # concurrency lane holds this job while a rebuild (build-feed.yml), a
      # full refresh or an earlier tick pushes; built on the older commit,
      # its state files (first_seen, VAO counter, Wächter state) would win
      # the rebase conflict in ``publish_to_main.sh`` over the newer ones.
      # Seen once: 17.10.2026 08:30 UTC, the tick waited 57 s for the
      # rebuild after the merge of #2034 (no entry lost that time). Same
      # rule as build-feed.yml.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          # Shallow on purpose: the full history is ~55 MB and grows with
          # every committed cache/ledger version, while the tip alone is
          # ~7 MB and stays flat. ``git pull --rebase --autostash`` in the
          # publish step only needs the checkout commit as merge base (it
          # is present), so a concurrent push from ``update-stations.yml``
          # / ``seo-guard.yml`` still replays cleanly. The backup-cron
          # freshness gate below deepens the history itself when it needs it.
          fetch-depth: 1
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      # Configure the bot git identity once, up front, so every later
      # git-writing step shares it (today: the commit/push at the end).
      # Set on the local repo (not --global); it persists in .git/config
      # across steps in the shared workspace. actions/checkout does not
      # set a committer identity, so without this ``git commit`` would
      # fail with "Please tell me who you are".
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Backup-cron freshness gate: on a ``schedule`` run, skip the work when a
      # cycle tick committed within ~35 min. Code: scripts/cycle/freshness_gate.sh.
      - name: Backup-cron freshness gate
        id: freshness
        shell: bash
        run: exec bash scripts/cycle/freshness_gate.sh

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # Hugging Face Hub cache for the EN translation model
      # (Helsinki-NLP/opus-mt-de-en, ~300 MB). Without this, every
      # ~30-min cycle tick would have to re-download the model — and
      # the first-time download is what previously caused the EN feed
      # to flag every item as ``[Partially translated]``: the pipeline
      # could not initialise inside the workflow, so ``_translate_text``
      # fell back to the German source for every disruption. The cache
      # key rotates monthly (``YYYY-MM``) so the upstream model can
      # autoupdate within ~30 days; ``restore-keys`` falls back to the
      # previous month to keep the warm cache.
      - name: Resolve Hugging Face cache key
        id: hf-cache-key
        shell: bash
        run: |
          echo "month=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Cache Hugging Face hub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ steps.hf-cache-key.outputs.month }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      # Cache the entire installed virtual environment instead of the
      # pip download cache. ``setup-python``'s ``cache: 'pip'`` only
      # speeds up wheel resolution; pip still spends ~30 s rebuilding
      # the site-packages on every cycle tick. A venv cache lets us
      # skip the install step entirely on the common path (deps
      # unchanged), shaving ~20 s off each of the 48 daily runs.
      #
      # Cache key includes the resolved Python version (so a runner-
      # image bump from 3.11.10 → 3.11.11 invalidates correctly), a
      # content hash of ``requirements.txt`` AND of
      # ``install-deps/action.yml``. Any of these changing — adding
      # a dep, bumping a pinned version, modifying the install
      # procedure, the runner upgrading the base interpreter —
      # invalidates the cache so we never run with a venv that does
      # not match the current contract. NO ``restore-keys`` fallback:
      # a partial-match restore would land us on a stale venv that
      # could shadow a pinned upgrade silently.
      #
      # Security: actions/cache scopes caches per branch; a cache
      # written by a PR run cannot poison the ``main`` cache scope
      # (the cache-poisoning class described in
      # https://adnanthekhan.com/2024/05/06/the-monsters-in-your-build-cache-github-actions-cache-poisoning/
      # is mitigated by GitHub's branch isolation — caches created
      # on PR refs cannot be read from base-branch runs).
      - name: Restore Python virtual environment
        id: venv_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          # ``update-cycle.yml`` itself is hashed in so any inline
          # change to the install procedure (PR #1600 added the
          # ``pip install torch …`` line in the cache-miss branch
          # below; the cache key did NOT change because neither
          # ``requirements.txt`` nor ``install-deps/action.yml``
          # was touched, so existing cached venvs from before the
          # fix kept being restored — the install step was gated
          # off and ``torch`` stayed missing, leaving the EN feed
          # stuck on the ``[Partially translated]`` marker for
          # ~10 items/tick). Hashing the workflow file closes
          # that class of drift at the cache-key boundary.
          # Not hashed: the files under ``scripts/cycle/``. The install stays
          # in the next step of this file; the torch backstop only repairs a
          # venv without torch. A change to them costs no reinstall.
          key: venv-${{ runner.os }}-py${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('requirements.txt', '.github/actions/install-deps/action.yml', '.github/workflows/update-cycle.yml') }}

      - name: Install dependencies (cache miss)
        if: steps.venv_cache.outputs.cache-hit != 'true'
        # Mirrors the ``install-deps`` composite action's pip cap
        # (<27, see ``.github/actions/install-deps/action.yml``); we
        # inline it here so the cached path produces a venv whose
        # interpreter + pip version match what the composite would
        # have built. Other workflows continue to use the composite.
        #
        # PyTorch (CPU-only wheel) is installed BEFORE the project
        # requirements file so the transformers package shipped in
        # ``requirements.txt`` finds a working torch backend at runtime.
        # Without this step the translator load (``_load_translator``)
        # fails (with transformers 4: ``RuntimeError: Models won't be
        # available``) and every
        # EN-feed item degrades to the ``[Partially translated]``
        # marker (root cause of the partially-untranslated live feed
        # on 2026-05-21). Once the venv is cached the torch wheel sits
        # inside ``.venv/lib/…`` so the cache-hit path skips the
        # re-download (~750 MB saved per cycle tick).
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "pip<27"
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt

      - name: Prepend venv to PATH
        # Persists across subsequent steps; ``$GITHUB_PATH`` is the
        # documented mechanism for cross-step PATH mutation.
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Self-healing torch backstop: install the CPU-only wheel when the venv
      # lacks torch. Code: scripts/cycle/ensure_torch.sh.
      - name: Ensure torch CPU wheel is present (self-healing)
        shell: bash
        run: exec bash scripts/cycle/ensure_torch.sh

      # ----- Cache fetchers (free APIs, no quota gate) ---------------------

      # Parallel free-API fetchers (Wiener Linien, ÖBB, Baustellen), each best
      # effort; output ``exit_codes``. Code: scripts/cycle/fetch_free_apis.sh.
      - name: Refresh free-API caches in parallel
        id: fetch
        if: steps.freshness.outputs.should_run == 'true'
        # Defense-in-depth step ceiling. The per-process ``timeout 90``
        # wrappers in the script catch a single hung fetcher (their exit code
        # 124 surfaces via the report() ``::warning::`` annotation, so
        # the other two fetchers' caches still refresh on the same
        # tick). This step-level ``timeout-minutes: 3`` is the fallback
        # if ALL three processes hang past their per-process budget
        # OR if the ``wait`` plumbing itself misbehaves (e.g. a bash
        # job-control quirk). 3 min ≈ ``90s parallel + reporting`` —
        # comfortably above the per-process ceiling but tight enough
        # to leave 7 min of the job's 10-min budget for VAO + feed
        # build + commit. Healthy ticks finish this step in ~30s.
        timeout-minutes: 3
        env:
          # Keep what each source delivered and what its fetch dropped in
          # ``data/raw/<source>/`` (``src/utils/raw_capture.py``); committed
          # by ``git add -A`` below, the git history is the archive.
          RAW_CAPTURE: '1'
        run: exec bash scripts/cycle/fetch_free_apis.sh

      # ----- Stammstrecke (VOR /trip — the single quota-gated API) --------

      # Defense-in-depth pre-flight: read the persisted VAO daily
      # counter (``data/vor_request_count.json``) and SKIP the
      # Stammstrecke poll when a fresh run would breach the
      # contractual 100/day cap. The in-script ``_charge_one_request``
      # guard is still active as a second-layer enforcer; this
      # preflight makes the budget-exhausted state explicit at the
      # top of the workflow log so operators can spot it without
      # scraping the script's DEBUG output.
      #
      # ``--margin 1`` mirrors the SINGLE ``/departureBoard`` request
      # the Hauptbahnhof-based monitor makes per cron tick. (Pre-2026-
      # 05-15 the legacy ``update_stammstrecke_status.py`` made TWO
      # ``/trip`` calls per tick — one per direction — and the margin
      # was 2.)
      - name: VAO quota pre-flight
        id: vor_preflight
        if: steps.freshness.outputs.should_run == 'true'
        # ``continue-on-error: true`` — the preflight script
        # intentionally exits 1 when the budget is exhausted. We do
        # NOT want that to fail the workflow; instead the conditional
        # gate on ``steps.vor_preflight.outputs.quota_ok`` controls
        # the API step below.
        continue-on-error: true
        run: python scripts/preflight_quota_check.py --check vor --margin 1

      # Stammstrecke delay monitor. Since 2026-05-15 uses
      # ``/departureBoard`` at Wien Hauptbahnhof
      # (``update_stammstrecke_hbf.py``) which lifts the ``numF=6``
      # capture ceiling that the legacy ``/trip``-based
      # ``update_stammstrecke_status.py`` inherited from the VAO API.
      # One ``/departureBoard`` poll returns ALL Stammstrecke trains
      # in the 45-min duration window — a single API call per tick
      # covers both directions (south = Meidling, north = Praterstern;
      # the pre-2026-05-15 north label was "Floridsdorf" — see the
      # rename rationale in update_stammstrecke_hbf.py), classified
      # via terminus whitelists. Rollback path: swap the
      # script name back to ``update_stammstrecke_status.py`` and
      # bump ``--margin`` above to ``2``.
      - name: Refresh Stammstrecke status
        if: ${{ steps.vor_preflight.outputs.quota_ok == 'true' }}
        continue-on-error: true
        run: python scripts/update_stammstrecke_hbf.py

      # ----- Feed build (consumer of the caches; one pass along Gemini's chain at most)

      - name: Build feed
        id: build
        if: steps.freshness.outputs.should_run == 'true'
        # Step ceiling below the 10-min job cap so a hung builder (e.g. a
        # stalled translation-pipeline call) is killed fast and still
        # leaves budget for the publish step. Healthy builds finish well
        # under a minute. The key: a new disruption the rules leave unclear is put to Gemini once, no new
        # request after 15 s (src/ki_entscheidung, owner 2026-11-12); without an answer the rules decide.
        timeout-minutes: 5
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Atom links: the Pages base comes from the runner's ``$GITHUB_REPOSITORY`` vars,
          # not the event payload (empty on ``schedule`` events); forks get their own repo.
          export PAGES_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python -m src.cli feed build

      # ----- README + dashboard render (no API call) ----------------------

      # README snapshot on every tick, the yearly dashboard only on the first
      # tick after midnight Vienna time. Code: scripts/cycle/refresh_stats.sh.
      - name: Refresh statistics dashboard and README snapshot
        id: stats
        if: steps.freshness.outputs.should_run == 'true'
        # Not the deliverable (``docs/feed.xml`` is): the step runs BEFORE
        # the commit so its output rides the same atomic commit, but a crash
        # here must NEVER abort the job and block the feed publish
        # (``continue-on-error``: orange, the README stays one tick stale; from 04.01. the
        # script's ``--fail-on-missing-review`` ends every tick with 1 while a year's review
        # is overdue). The key: the run after midnight, after all its writes, asks Gemini
        # (one pass over the chain for each finished year without an accepted review); all
        # requests start within one 110 s budget (year_archive.py).
        continue-on-error: true
        timeout-minutes: 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: exec bash scripts/cycle/refresh_stats.sh

      # Stage 3 of the line check (audit 2026-09-25, A.14): compares the lines
      # of the German feed with the station directory and logs what it cannot
      # confirm ("not confirmed", never "wrong": HAFAS hides lines during long
      # closures). Report only: never touches the feed. It collects its
      # anomalies in ``data/feed_line_anomalies.json`` for later review (audit
      # 2026-09-26) and therefore runs before the publish, like the statistics
      # step, so the collection rides the same commit. It takes about a
      # second; ``continue-on-error`` and the 1-minute limit keep a failure or
      # a hang from blocking the feed.
      - name: Check feed lines (report only)
        id: lines
        if: steps.freshness.outputs.should_run == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/check_feed_lines.py

      # Feed-Wächter (docs/reference/feed_watch.md): checks the built German feed
      # against the rules learned since September 2026 (duplicates, an old
      # message counted as new, a "Seit" time before the incident, ÖBB's
      # second sentence, the time line, text length), reports an item the build step above skipped (docs/feed-health.json),
      # compares what the sources delivered with the last seven days and notes a source that
      # has given no fresh answer for two hours (exit codes of the fetch step). Report only: it never
      # changes the feed and never blocks the publish (exit 0 even on its own
      # error; ``continue-on-error`` and the time limit on top). Findings are
      # never red (operator decision 2026-10-10: red only when the fetch does
      # not work): they show as ``::warning`` annotations, in
      # ``data/feed_watch.json`` (rides this run's commit, the Health check
      # reads it as a note) and as one GitHub issue per broken rule, which
      # closes itself once the rule holds again. ``issues: write`` above
      # exists for this step and the next one.
      - name: Feed-Wächter (report only)
        id: watch
        if: steps.freshness.outputs.should_run == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          FEED_WATCH_ISSUES: '1'
          FEED_WATCH_FETCH_EXIT: ${{ steps.fetch.outputs.exit_codes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/feed_watch.py

      # IFTTT ticks again: close the issue ``ifttt-ausfall`` (src/takt_fallback.py).
      - name: Close IFTTT outage issue
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/takt_fallback.py --close-issue

      # The three side steps above never block the publish, so a failure left
      # only an orange annotation in a green run. Operator decision 2026-10-28
      # (Michael): a side step that cannot run turns the Health check red, "denn
      # ein Fehler sollte auffallen". This step writes each one's ``outcome``
      # (``conclusion`` reads ``success`` under ``continue-on-error``) to
      # ``data/side_steps/update-cycle.json``, which rides this run's commit;
      # ``scripts/health_check.py`` (check "Nebenschritte") reads it, and a
      # record older than 4 h is red there as well. ``!cancelled()`` so it
      # also runs after a failed side step; it never blocks the publish. "KI-Entscheidung" is
      # the build's own word (output ``ki_outcome``): failure = it cannot ask (key missing or refused).
      - name: Record side-step outcomes
        if: ${{ !cancelled() && steps.freshness.outputs.should_run == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          STATS_OUTCOME: ${{ steps.stats.outcome }}
          LINES_OUTCOME: ${{ steps.lines.outcome }}
          WATCH_OUTCOME: ${{ steps.watch.outcome }}
          KI_OUTCOME: ${{ steps.build.outputs.ki_outcome }}
        run: >-
          python scripts/record_side_steps.py
          --state data/side_steps/update-cycle.json
          "Statistik=$STATS_OUTCOME"
          "Linienprüfung=$LINES_OUTCOME"
          "Feed-Wächter=$WATCH_OUTCOME"
          "KI-Entscheidung=$KI_OUTCOME"

      # ----- Validate + single atomic publish ----------------------------

      # ONE never-fail step does the whole publish: validate the built
      # feed, stage everything, commit, and push with retry + concurrent-
      # push reconcile folded in. This is the MOST IMPORTANT workflow in
      # the project (the live feed's ~30-min heartbeat) and must never go
      # red on a transient infrastructure blip.
      #
      # Why a repo script and not an external commit action: a ``uses:``
      # action is resolved and DOWNLOADED by the runner in the "Prepare
      # all required actions" setup phase, BEFORE the first step runs;
      # when codeload.github.com hiccups, that download fails and the
      # whole job dies in setup — before any retry/fallback could run.
      # (Observed 2026-05-26 12:30 UTC: ``git-auto-commit-action`` 404'd
      # from codeload "after 1 attempts" and the entire tick was lost.)
      # ``git`` is pre-installed and the script is part of the checkout.
      #
      # Robustness contract, documented in the header of
      # ``scripts/publish_to_main.sh`` (shared by every workflow that writes
      # to ``main``): validate the feeds first (``--validate-feeds``: a
      # malformed or empty feed skips the publish, warning + exit 0),
      # ``--all`` stages every workspace output (the feed-health reports stay
      # out via ``.gitignore``), no changes is a clean no-op, a PLAIN push
      # with 4 attempts and ``git pull --rebase`` in between, never a force,
      # and when every attempt fails a warning + exit 0: the outputs of this
      # tick stay unpublished (~30 min of staleness), the repo keeps the last
      # good commit and the next tick rebuilds from fresh caches; a red
      # workflow would page the operator for a non-actionable blip.
      - name: Validate and publish cycle outputs
        shell: bash
        run: >-
          bash scripts/publish_to_main.sh --validate-feeds --all
          --label cycle-publish --message "chore: update cycle"

      # ----- The daily KI-Wächter -----------------------------------------
      # Sends ``repository_dispatch: ki-waechter`` when the audit is due (from
      # 15:00 Vienna time, once a day, two hours after a failed try, no run of
      # the watcher active; src/ki_waechter/dispatch.py has the reasons, 9:00
      # until 2026-11-05). After the publish, so the audit sees this tick's
      # feed; ``main`` only; not after a failed tick (no ``always()``); a failed
      # dispatch only warns. Until 2026-11-05 the gate ran on all 48 ticks.
      - name: Start the KI-Wächter when due
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Same numbers as ki-waechter.yml names (a test keeps them equal).
          KI_WAECHTER_START_HOUR: "15"
          KI_WAECHTER_RETRY_HOURS: "2"
        run: python scripts/ki_waechter.py dispatch
