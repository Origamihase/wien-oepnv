name: Health check

# Standalone watchdog for the data pipeline. It is intentionally ALLOWED to go
# red: a failed scheduled run makes GitHub e-mail the maintainer (see the repo's
# Watch / Actions notification settings — GitHub notifies the user who owns the
# scheduled workflow, and for a run started by the Update run its actor). The readable diagnosis is printed in the run log and the
# job summary, so the linked run tells you immediately WHAT broke.
#
# This workflow is fully independent of update-cycle.yml:
#   * A red health check NEVER affects the feed build.
#   * The feed build is NEVER made to fail by this workflow.
# It only READS the repo (contents: read) and never commits.

on:
  schedule:
    # Every 6 hours on paper. GitHub delivers it late and not always: since
    # 2026-10-05 three runs a day, two to seven hours after the slot
    # (docs/development.md, "Geplante Läufe"), so the detection latency for
    # a stalled feed or an unreachable source is up to ~10 h, not ~6 h.
    # Increase the frequency for faster alerts; the trade-off is more
    # e-mails while an outage persists (GitHub mails on every failed run,
    # there is no built-in dedupe).
    - cron: '0 */6 * * *'
  # Once an hour, started by the Update run (operator decision 2026-10-28,
  # card "Linie, Issue als Frühwarnung"): on 28.10.2026 GitHub started no
  # scheduled run between 13:19 and 23:19 Vienna time, so the Stammstrecke
  # outage from 15:00 never turned red. The Update run itself is carried by
  # IFTTT every 30 minutes; the ``gate`` job below lets the first one of each
  # hour through. A failed run started this way mails the actor of the Update
  # run (the repository owner, who owns the IFTTT dispatch token). The cron
  # above stays as the fallback when the Update run stops. While an outage
  # lasts, a red run mails once an hour.
  workflow_run:
    workflows: ["Update cycle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  # Two Update runs an hour, one Health check: an Update run that completes in
  # the second half of the hour (UTC minute 30-59) is skipped. Schedule and
  # manual runs always pass.
  gate:
    name: Once an hour
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          minute=$(date -u +%M)
          minute=${minute#0}
          if [ "$EVENT" = "workflow_run" ] && [ "$minute" -ge 30 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Second Update run of this hour (UTC minute $minute): no Health check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  health:
    name: Probe sources & output freshness
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Generous ceiling: three live source fetches (each retried internally,
    # hard-capped at HEALTH_FETCH_TIMEOUT_SECONDS=120s) plus two file reads
    # finish in well under a minute on a healthy day.
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned. Mirrors the other workflows.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: pip

      # Full requirements.txt so the live-canary subprocesses run with the exact
      # same dependency set as production (update-cycle.yml). torch is NOT
      # needed here (it is only used by the EN-feed translation path).
      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run health check
        # Only the secrets the feed pipeline uses (WORKFLOW_SECRETS in
        # scripts/health_check.py, kinds "required" and "optional"). The check
        # tests them for emptiness and prints names, never values; GitHub
        # masks them in the log as well.
        env:
          VOR_ACCESS_ID: ${{ secrets.VOR_ACCESS_ID }}
          VOR_BASE_URL: ${{ secrets.VOR_BASE_URL }}
        run: python scripts/health_check.py
