name: Build feed

# DISABLED CRON (2026-05-09): the regular ``15,45`` schedule was
# replaced by ``update-cycle.yml``, a single-job sequential pipeline
# whose ``feed build`` step runs after every cache fetcher in the
# same runner — the in-runner step order (not a staggered cron)
# drives the timing. The pipeline is triggered by the IFTTT
# ``ifttt_feed_trigger`` repository_dispatch event (~30-min cadence;
# see header of update-cycle.yml).
#
# This workflow remains as the code-change verification path: a push
# to ``src/**`` etc. rebuilds the feed from whatever caches are
# currently on main, without firing any upstream API. The
# ``workflow_dispatch`` trigger lets operators force a rebuild after
# a manual cache refresh.
#
# Both retained triggers go through the same single job below, which
# reads only on-disk artefacts (caches + Stammstrecke CSV ledger)
# and never calls any upstream API or provider itself.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/build-feed.yml'

permissions:
  contents: read

# Concurrency lane. On ``main`` this workflow commits ``chore: rebuild
# feed`` — touching ``data/first_seen.json`` and the feed XMLs — to the
# SAME branch that ``update-cycle.yml`` and ``manual-full-refresh.yml``
# push to. Those run in the ``external-api-fetch`` group; if this workflow
# kept its own lane it could push to ``main`` WHILE a cycle tick is
# mid-build, and the cycle's ``git pull --rebase --autostash`` would then
# re-apply its autostash on top of our just-pushed ``first_seen.json`` —
# leaving an unmerged index that crashed the cycle's auto-commit (observed
# 2026-05-25). Sharing ``external-api-fetch`` on ``main`` serialises the
# three feed-writing workflows so two of them can never race the same pull
# window. Non-``main`` (PR / branch) builds keep their own per-ref lane —
# they only verify code changes and never push (see the
# ``if: github.ref == 'refs/heads/main'`` guards on the commit steps), so
# they stay parallel and fast.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'external-api-fetch' || format('build-feed-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Defense-in-depth ceiling: a healthy feed build (cache miss for HF +
    # pip + feed compose + EN translation pass) runs in 8-12 min. The
    # cache-hit path is much faster (~3 min). 20 min gives ~2x headroom
    # over the slowest legitimate cold-cache run while catching hangs
    # (stuck network fetch, hung translation pipeline) quickly. Without
    # the cap the workflow inherits GitHub's 360-min default. Mirrors the
    # canonical defence shape established in update-cycle.yml.
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # Hugging Face Hub cache. The translation model
      # ``Helsinki-NLP/opus-mt-de-en`` (~300 MB) is fetched on the first
      # EN-feed run; subsequent runs hit the on-disk cache. The cache key
      # rotates monthly (YYYY-MM) so an auto-updated model still has a
      # chance to land within ~30 days while keeping daily-bandwidth
      # usage flat. ``restore-keys`` falls back to the previous-month
      # cache so the rotation does not force a fresh download.
      - name: Resolve Hugging Face cache key
        id: hf-cache-key
        shell: bash
        run: |
          echo "month=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Cache Hugging Face hub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ steps.hf-cache-key.outputs.month }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      # PyTorch CPU-only wheel (saves >1 GiB versus the default CUDA
      # build) — keep this step BEFORE the project requirements install
      # so the transformers pipeline finds an already-resolved torch.
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # Compose the RSS feed from on-disk artefacts only. ``feed build``
      # reads the provider caches plus the Stammstrecke CSV ledger via
      # :mod:`src.feed.stammstrecke` (1-hour window, 9-min threshold)
      # and writes ``docs/feed.xml`` + ``data/first_seen.json``. No
      # network I/O.
      - name: Build feed
        run: python -m src.cli feed build
        env:
          # Atom self/alternate-Links werden direkt im Python-Builder
          # geschrieben. Aus dem aktuellen Repo abgeleitet, damit Forks
          # korrekte atom:link-URLs schreiben statt auf das Original-Repo
          # zu zeigen.
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # Patch the README ``<!-- STATS:* -->`` markers with the 30-day
      # rolling snapshot. Reads only ``data/stats/*.csv`` (no network),
      # idempotent at the byte level, atomic write.
      #
      # ``--skip-dashboard`` pins this workflow to README-only output:
      # ``docs/statistik.md`` is the *yearly* dashboard and is owned by
      # the once-daily 00:00 Europe/Vienna tick of ``update-cycle.yml``.
      # Code-push triggers fire at unpredictable times of day and used
      # to silently move the dashboard's ``_Automatisch erzeugt am ..._``
      # timestamp every time someone pushed to ``src/**``, breaking the
      # "exactly one dashboard refresh per Vienna day" contract. Operators
      # who explicitly want a dashboard regen out-of-band run
      # ``manual-full-refresh.yml`` (the ``alles neu`` button that
      # also rebuilds caches, station directory and feed).
      - name: Refresh README snapshot (dashboard handled by update-cycle.yml)
        run: python scripts/generate_markdown_stats.py --skip-dashboard

      # Publish the rebuilt outputs with plain ``git``, mirroring the
      # "Validate and publish cycle outputs" step of update-cycle.yml.
      #
      # Why not ``git-auto-commit-action`` any more: since this workflow was
      # (re)introduced on 2026-09-12 every ``chore: rebuild feed`` commit it
      # produced carried only ``data/first_seen.json``. The action listed
      # ``M docs/feed.xml`` / ``M docs/feed.en.xml`` / ``M README.md`` in its
      # own status output and then committed "1 file changed" (run
      # 36003339176, 2026-09-24 13:07 UTC; the same on all six rebuild
      # commits since 2026-09-13). Its multi-line ``file_pattern`` evidently
      # stages no more than the first entry, so the public feed reached
      # subscribers only with the next update-cycle tick, up to 30 minutes
      # after the merge that fixed it — while the state file with the new
      # EN translations was already on ``main``. Staging the allowlist
      # ourselves has no such ambiguity, and — as update-cycle.yml found on
      # 2026-05-26 — a ``uses:`` action is one more download that can fail
      # before any step runs.
      #
      # Robustness contract (same as update-cycle.yml):
      #   * VALIDATE first — a malformed or empty feed XML skips the publish
      #     (warning + exit 0) so the last-good feed stays online.
      #   * stage ONLY the allowlist below. ``docs/statistik.md`` stays out
      #     (see ``--skip-dashboard`` above); ``docs/stats-summary.json`` is
      #     a by-product of the README patch and stays out as before.
      #   * no changes -> clean no-op (exit 0).
      #   * push with up to 4 attempts and exponential backoff; on a
      #     non-fast-forward, ``git pull --rebase`` replays our commit and
      #     a conflict resolves to the locally-built regeneration.
      #   * if every attempt fails -> warning + exit 0; the next cycle tick
      #     rebuilds and publishes from fresh caches.
      - name: Validate and publish feed outputs
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          # Keep ``git rebase --continue`` non-interactive.
          GIT_EDITOR: 'true'
          # Abort a stalled push/pull transfer (< 1 KB/s for 30 s).
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '30'
        run: |
          # NOTE: intentionally NO ``-e`` — every failure below is handled
          # explicitly so the step can guarantee exit 0.
          set -uo pipefail
          shopt -s nullglob

          # actions/checkout sets no committer identity; without this
          # ``git commit`` fails with "Please tell me who you are".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1) Pre-publish sanity gate. Never ship a malformed or empty feed.
          for feed in docs/feed.xml docs/feed.en.xml; do
            [ -f "${feed}" ] || continue
            if [ ! -s "${feed}" ]; then
              echo "::warning title=feed-validate::${feed} is empty — skipping publish (last-good feed stays online)."
              exit 0
            fi
            if ! python -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "${feed}"; then
              echo "::warning title=feed-validate::${feed} is not well-formed XML — skipping publish (last-good feed stays online)."
              exit 0
            fi
          done

          # 2) Stage the allowlist + commit. ``docs/feed.xml`` is the public
          #    output; ``data/first_seen.json`` is the build state and must
          #    commit alongside it; the ``stoerungen_<YYYY>.csv`` ledgers are
          #    appended by ``append_disruption_row`` for every new disruption
          #    identity (audit finding 2026-05-09); ``README.md`` carries the
          #    regenerated 30-day snapshot.
          for path in data/first_seen.json docs/feed.xml docs/feed.en.xml README.md data/stats/stoerungen_*.csv; do
            [ -e "${path}" ] && git add -- "${path}"
          done
          if git diff --cached --quiet; then
            echo "Rebuild produced no changes — nothing to commit or push."
            exit 0
          fi
          git commit -m "chore: rebuild feed"

          # 3) Push with retry + concurrent-push reconcile + never-fail.
          branch="${GITHUB_REF_NAME}"
          max_attempts=4
          delay=2
          attempt=1
          while :; do
            if git push --force-with-lease origin "HEAD:${branch}"; then
              echo "Feed outputs published on attempt ${attempt}/${max_attempts}."
              exit 0
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::warning title=feed-publish::git push failed after ${max_attempts} attempts; this rebuild's outputs were NOT published. The next update-cycle tick rebuilds and publishes from fresh caches. Not failing the workflow."
              exit 0
            fi
            echo "Push attempt ${attempt}/${max_attempts} failed; re-syncing with origin/${branch} and retrying in ${delay}s."
            sleep "${delay}"
            if ! git pull --rebase --autostash origin "${branch}"; then
              # A rebase replay can stop on a conflict. Every output here is
              # a full regeneration, so the locally-built copy (the commit
              # being replayed = "theirs" in rebase terms) wins; the
              # ``merge=union`` CSV ledgers auto-resolve and never reach here.
              mapfile -t -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
              if [ "${#conflicts[@]}" -gt 0 ]; then
                echo "::warning title=feed-reconcile::rebase conflict on a concurrent push; keeping locally-built copies for: ${conflicts[*]}"
                git checkout --theirs -- "${conflicts[@]}"
                git add -- "${conflicts[@]}"
                git rebase --continue || git rebase --abort || true
              else
                # Not a conflict (the fetch itself failed) — abort any
                # half-started rebase and just retry the push.
                git rebase --abort 2>/dev/null || true
              fi
            fi
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
