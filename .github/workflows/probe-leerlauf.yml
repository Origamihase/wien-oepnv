name: Probe Leerlauf

# One-off measurement (2026-11-02), removed after it ran: does a TCP
# connection from a GitHub-hosted runner survive several minutes without
# traffic? The KI-Wächter request of 2026-11-02 died after 261 s with a
# ConnectionError while Gemini was still thinking. No Gemini request.

on:
  push:
    branches: [claude/project-thread-uprv4n]
    paths: [.github/workflows/probe-leerlauf.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Idle TCP connections to an echo server
        shell: python
        run: |
          import socket, threading, time

          HOST, PORT = "tcpbin.com", 4242

          def probe(label, idle, keepalive):
              t0 = time.monotonic()
              try:
                  s = socket.create_connection((HOST, PORT), timeout=20)
                  if keepalive:
                      s.setsockopt(socket.SOL_SOCKET, socket.SO_KEEPALIVE, 1)
                      s.setsockopt(socket.IPPROTO_TCP, socket.TCP_KEEPIDLE, 60)
                      s.setsockopt(socket.IPPROTO_TCP, socket.TCP_KEEPINTVL, 30)
                      s.setsockopt(socket.IPPROTO_TCP, socket.TCP_KEEPCNT, 5)
                  s.sendall(b"start\n"); first = s.recv(100)
                  time.sleep(idle)
                  s.sendall(b"after\n"); s.settimeout(30); second = s.recv(100)
                  res = f"ok ({first!r} / {second!r})"
              except Exception as exc:
                  res = f"FEHLER {type(exc).__name__}: {exc}"
              print(f"{label}: Leerlauf {idle} s, Keepalive {'an' if keepalive else 'aus'}: {res} nach {time.monotonic()-t0:.0f} s", flush=True)

          cases = [("A", 120, False), ("B", 300, False), ("C", 420, False), ("D", 300, True), ("E", 420, True)]
          threads = [threading.Thread(target=probe, args=c) for c in cases]
          for t in threads: t.start()
          for t in threads: t.join()
