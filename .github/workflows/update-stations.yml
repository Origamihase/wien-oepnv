name: Update station directory

# Refresh the canonical ``data/stations.json`` directory once per week
# (Sundays 01:00 UTC = 02:00/03:00 Vienna). The script merges four
# upstream sources:
#
# * ÖBB ``Verzeichnis der Verkehrsstationen`` Excel — ``update_station_
#   directory.py`` downloads the workbook from data.oebb.at on every
#   run, with atomic-write of a cached snapshot to
#   ``data/oebb-verkehrsstationen.xlsx`` for soft-fail fallback on a
#   transient outage; free open data, no auth.
# * Wien OGD ``wienerlinien-ogd-haltestellen``/``-haltepunkte`` CSVs
#   (plus ``-linien``/``-fahrwegverlaeufe`` for each station's
#   ``wl_lines``) —
#   ``update_wl_stations.py`` downloads the latest snapshot from
#   the canonical Wiener Linien OGD host
#   (``www.wienerlinien.at/ogd_realtime/doku/ogd/``) on every run
#   (``--download`` default-on) with graceful fallback to the pinned
#   local CSV on upstream outage; free open data, no auth. The same script
#   loads the WL GTFS ``stops.txt`` (``data/wienerlinien-gtfs-stops.csv``,
#   CC BY 4.0), used only where every OGD stop of a DIVA lies outside the
#   WL network. Every good answer (200/304) stamps ``checked_at`` into the
#   file's ``.cache.json`` (the ÖBB workbook too); the health check turns
#   red after 15 days without one.
# * HAFAS (ÖBB Scotty) — ``_enrich_with_hafas`` runs ONLY for the
#   subset of stations still missing coordinates
#   (``_stations_missing_coordinates`` strict subset). There is no
#   further tier: the Google Places stage was removed on 2026-10-16
#   (Michael's decision: only openly licensed coordinates) and the
#   OpenStreetMap stage on 2026-10-17 (ODbL share-alike would cover the
#   whole published directory).
#
# VOR is intentionally not invoked from this workflow (the project
# reserves the VAO 100/day budget for the Stammstrecke monitor — see
# ``update-cycle.yml``). VOR station IDs come from the
# pinned ``data/vor-haltestellen.csv`` snapshot.
on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Verhindert, dass sich Cron- und manuell ausgelöste Läufe gegenseitig
# beim `git push` blockieren oder fehlschlagen lassen.
concurrency:
  group: update-stations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Defense-in-depth ceiling: the weekly station-directory refresh is
    # the second-heaviest workflow after manual-full-refresh. It does
    # the ÖBB Excel pull + WL OGD CSV pull +
    # HAFAS manual-block enrichment + HAFAS coordinate fallback +
    # validation + diff + heartbeat. Healthy runs take
    # 25-45 min depending on HAFAS latency. 60 min
    # gives ~1.3x headroom while catching hangs (runaway HAFAS retry
    # loop) quickly. Without the cap the workflow
    # inherits GitHub's 360-min default. Mirrors the canonical defence
    # shape established in update-cycle.yml.
    # +20 min since 2026-09-25 for the ÖBB station lines step below (its own
    # 25-min step cap; ~650 paced HAFAS requests, ~12-15 min).
    timeout-minutes: 80
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned.
      #
      # ``ref: github.ref`` checks out the branch as it is when the job
      # starts, not the commit that triggered the run (``github.sha``): the
      # concurrency lane holds a run while an earlier one pushes, and a
      # directory built on the older commit would win a rebase conflict in
      # ``publish_to_main.sh`` over the newer one. Same rule as
      # build-feed.yml.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # VOR stop-list refresh removed 2026-05-09 to keep the project under
      # the VAO Start tier's 100/day quota — the Stammstrecke monitor
      # (``update-cycle.yml``) is the project's only auto-running VOR
      # API consumer and already owns 96 reqs/day. The station
      # directory update now relies on the pinned
      # ``data/vor-haltestellen.csv`` snapshot, which is redaktionell
      # gepflegt; the former ``fetch_vor_haltestellen.py`` helper was
      # removed from ``scripts/`` in the same pass. VOR station IDs
      # change rarely (years) so a many-month-old snapshot is
      # operationally equivalent to a fresh fetch.

      - name: Synchronize HAFAS Profile
        # Refresh data/hafas_profile.json from the upstream
        # public-transport/hafas-client OEBB profile so the HAFAS
        # fallback inside ``src/places/hafas_client.py`` picks up the
        # current ``salt`` / ``ver`` / ``aid`` triple. ÖBB rotates
        # these without notice; running the sync right before the
        # station-directory refresh keeps the cached profile fresh
        # without bloating the job runtime.
        run: python scripts/sync_hafas_profile.py

      - name: Refresh station directory
        run: python scripts/update_all_stations.py --verbose

      - name: Refresh ÖBB station lines (HAFAS)
        id: hafas_lines
        # Stage 2 of the line plausibility check (audit 2026-09-25, A.14):
        # the rail lines serving each ÖBB station in Vienna and the commuter
        # belt, from HAFAS departure boards, kept with a "last seen" date in
        # ``data/oebb_station_lines.json``. Best effort: a HAFAS outage must
        # not block the station directory commit, and the script keeps the
        # previous state for every station that did not answer.
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/update_oebb_station_lines.py --verbose

      - name: Regenerate validation report
        run: python -m src.cli stations validate --output docs/stations_validation_report.md

      # The HAFAS step never blocks the commit, so its failure left only an
      # orange annotation. Operator decision 2026-10-28 (Michael): a side step
      # that cannot run turns the Health check red, "denn ein Fehler sollte
      # auffallen". Its ``outcome`` (``conclusion`` reads ``success`` under
      # ``continue-on-error``) goes to ``data/side_steps/update-stations.json``
      # for ``scripts/health_check.py`` (check "Nebenschritte").
      - name: Record side-step outcomes
        continue-on-error: true
        timeout-minutes: 1
        env:
          HAFAS_LINES_OUTCOME: ${{ steps.hafas_lines.outcome }}
        run: >-
          python scripts/record_side_steps.py
          --state data/side_steps/update-stations.json
          "ÖBB-Stationslinien (HAFAS)=$HAFAS_LINES_OUTCOME"

      # Publish through ``scripts/publish_to_main.sh``, the publish path
      # shared by every workflow that writes to ``main`` (since 2026-10-10):
      # commit, then a PLAIN push (never ``--force-with-lease``, which
      # dropped the merge of PR #1783 from ``main`` on 2026-09-11, see
      # docs/archive/audits/audit-2026-09-12-force-push-history-loss.md)
      # with up to 4 attempts; a rejection by a concurrent push re-syncs
      # with ``git pull --rebase`` first and a conflict keeps the locally
      # built lines (the concurrent commit's other lines stay). It replaces the former pre-commit pull plus a single
      # push through ``git-auto-commit-action``, which went red whenever an
      # update-cycle commit landed in between (SEO Verify, 2026-10-04).
      # ``--strict``: a run that could not publish after every attempt
      # turns red, so a lost refresh does not pass unnoticed.
      # Every file this job writes (stations.json, the validation report,
      # the HAFAS profile, the Places quota counter) is a full regeneration,
      # so on a rebase conflict its conflicting lines are authoritative; a
      # station added by hand in a PR merged during the run keeps every line
      # that does not touch the regenerated ones (``keep_local_lines``).
      # ``data/oebb_station_lines.json`` accumulates, but only this job
      # writes it and it starts from the checked-out copy, so the local copy
      # wins there too. The station directory really can collide:
      # manual-full-refresh.yml also writes ``data/stations.json``.
      - name: Commit and push changes
        shell: bash
        run: >-
          bash scripts/publish_to_main.sh --all --strict --label publish
          --message "chore(data): refresh station directory [skip ci]"
