name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot-PRs und PRs aus Forks erhalten aus Sicherheitsgründen keinen
    # Zugriff auf Repository-Secrets — CLAUDE_CODE_OAUTH_TOKEN ist dort leer,
    # wodurch die Action ohne gültiges Token sofort fehlschlägt. Solche PRs
    # daher überspringen; auf einem PR aus diesem Repository ist ein leeres
    # oder abgelaufenes Token dagegen ein Fehler, der auffallen soll.
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Das Review ist beratend (postet Kommentare) und kein Qualitäts-Gate
        # (kein Pflicht-Check im Ruleset): ein Fehlschlag heißt nie „Code
        # schlecht", sondern immer Token oder Infrastruktur. Bis 2026-10-31
        # lief der Schritt mit ``continue-on-error``, damit ein Aussetzer
        # keinen roten Check erzeugt; dadurch blieb ein abgelaufenes Token
        # unsichtbar (Architektur-Review 2026-10-31, Fund B). Betreiber-
        # entscheidung (Michael, 2026-10-31, Regel vom 2026-10-28: „ein Fehler
        # sollte auffallen"): der Schritt darf scheitern. Der Lauf wird rot,
        # und der Health check liest das Ergebnis des letzten Laufs (Prüfung
        # ``Werkzeuge``, scripts/health_check.py) und wird stündlich rot, bis
        # ein Review wieder lief.
        uses: anthropics/claude-code-action@6c690188da61cf16ee7debb28383ba67f02abb4c # v1.0.242
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

