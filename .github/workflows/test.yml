name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Run test suite
    runs-on: ubuntu-latest
    # Defense-in-depth ceiling against a hang (stuck test, infinite
    # recursion, runaway fixture). Without it the workflow inherits
    # GitHub's 360-min default. The per-test pytest-timeout (60 s in
    # pyproject.toml) is the finer-grained gate; this is the backstop.
    #
    # Raised from 20 to 35 on 2026-09-17. The old value assumed
    # "~8000 tests, 6-10 min on a GH runner, ~2x headroom" — that
    # stopped being true as the suite grew. Measured on the runner:
    # 9316 tests, pytest alone 18:13, whole job ~20:12 including
    # checkout, install, static checks and station validation. The cap
    # had drifted *below* what a healthy run legitimately needs, so
    # whether a run passed came down to runner speed rather than to the
    # change under test: four of the twelve runs before this one were
    # cancelled at the wall (4696, 4703, 4704, 4706 — on PRs AND on
    # main, across different authors), and run 4702 finished with four
    # seconds to spare. Run 4706 was the clearest case: pytest reported
    # "9316 passed, 2 skipped in 1093.97s" and the timeout fired one
    # second later, during the coverage upload — a green suite reported
    # as a red check.
    #
    # 35 min is ~1.7x the slowest observed healthy run, which keeps the
    # hang-catching purpose intact while leaving room for the suite to
    # keep growing. If the wall clock itself becomes the problem,
    # parallelising the suite is the fix — not another bump.
    timeout-minutes: 35

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: src
    steps:
      # Workaround for actions/checkout#2351 (sporadic includeIf credential
      # race on v6 → "could not read Username, terminal prompts disabled").
      # Two attempts; remove once v6.0.3+ is pinned.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          requirements: requirements-dev.txt

      - name: Run static checks
        run: python scripts/run_static_checks.py

      - name: Validate stations
        run: python scripts/validate_stations.py

      - name: Overpass smoke check (advisory)
        # Probes the upstream Overpass mirror. Tests don't depend on Overpass
        # — :class:`OSMOverpassClient` is mocked everywhere — so this step
        # never fails the job; it just surfaces a warning when the mirror is
        # degraded so flaky integration runs are easier to attribute.
        run: python scripts/check_overpass_status.py --allow-skip --verbose
        continue-on-error: true

      - name: Run pytest
        run: python -m pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn
