name: KI-Wächter

# Daily display audit inside the project: Claude reads the ten feed items
# next to their source texts and reports what the TV viewer would read
# wrong. The successor of the Jules audits (Jules accepts no new sessions
# after 2026-11-11). Operator decision 2026-10-31 (Michael): the rules stay
# the feed chain; an AI only watches and reports, never rewrites. "Einen
# Jules-Ersatz (Wächter-KI) im Projekt selbst. Achte bitte weiterhin auf
# höchste Qualität und Effizienz." Details: docs/reference/ki_waechter.md.
#
# When: once a day, on the first successful Update cycle from 15:00 Vienna
# time. GitHub's own cron fires only a few of its slots a day here
# (docs/architecture.md, Workflows), the IFTTT-driven Update cycle every
# 30 minutes, so this workflow hangs off ``workflow_run`` of that cycle.
# The ``gate`` job ends in seconds on every other tick: before 15:00, after
# a failed cycle, or when today's run is already recorded in
# ``data/side_steps/ki-waechter.json`` (also after a failure: no retries
# that day, the Health check is red instead and a manual run is possible).
#
# How: ``scripts/ki_waechter.py prepare`` writes the input (feed, English
# feed, source events); Claude Code runs headless with read-only tools
# (Read, Grep, Glob; no Bash, no Write, no web) on
# ``scripts/ki_waechter_prompt.md``; ``scripts/ki_waechter.py verify``
# checks every quote verbatim against feed and sources before a finding
# counts and writes ``docs/archive/audits/ki-waechter-YYYY-MM-DD.md``.
# Findings open one GitHub issue (label ``ki-waechter``). The feed is never
# changed.
#
# A failed run is red here and turns the Health check red ("Nebenschritte",
# record ``data/side_steps/ki-waechter.json``): a stage that cannot run, a
# dead token for instance, must be noticed (Michael 2026-10-28).
#
# Pull requests that touch the watcher run it on two days with known
# findings (27.10.2026: "algae path" for Algenweg, 40A twice; 30.10.2026:
# "All Saints' Worship") and on the current feed, without publishing.

on:
  workflow_run:
    workflows: ["Update cycle"]
    types: [completed]
  workflow_dispatch:
    inputs:
      rev:
        description: "Commit, dessen Feed geprüft wird (leer: aktueller Stand; ein anderer Commit wird nicht veröffentlicht)"
        required: false
        default: ""
  pull_request:
    paths:
      - scripts/ki_waechter.py
      - scripts/ki_waechter_prompt.md
      - .github/workflows/ki-waechter.yml

permissions:
  contents: read

concurrency:
  group: ki-waechter-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  # Claude model of the audit. The quality of a finding matters more than
  # the run time (Michael 2026-10-30: "Falsche Funde stören mich am meisten").
  KI_WAECHTER_MODEL: claude-opus-5-5
  # Claude Code CLI, pinned (same version as claude-code-action v1.0.242).
  CLAUDE_CODE_VERSION: "2.1.290"
  # First Vienna hour of the day in which the audit runs.
  KI_WAECHTER_START_HOUR: "15"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
      revs: ${{ steps.decide.outputs.revs }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Decide whether to audit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CYCLE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CYCLE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REV_INPUT: ${{ inputs.rev }}
          OWNER_REPO: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          case "$EVENT" in
            pull_request)
              # A fork gets no secrets; its pull request skips the replay.
              if [[ "${PR_HEAD_REPO}" != "${OWNER_REPO}" ]]; then out "run=false"; exit 0; fi
              out "run=true"; out "publish=false"
              out 'revs=["001e47c665cec9f2d1d0c0c0d912230bb7f3795d","9e60b8de9dce438906b257e42a8b524e4f191f67","HEAD"]'
              exit 0 ;;
            workflow_dispatch)
              if [[ -z "${REV_INPUT}" ]]; then
                out "run=true"; out "publish=true"; out 'revs=["HEAD"]'
              elif [[ "${REV_INPUT}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
                out "run=true"; out "publish=false"; out "revs=[\"${REV_INPUT}\"]"
              else
                echo "::error title=KI-Wächter::rev muss ein Commit-Hash sein"; exit 1
              fi
              exit 0 ;;
          esac
          out "publish=true"; out 'revs=["HEAD"]'
          if [[ "${CYCLE_CONCLUSION}" != "success" || "${CYCLE_BRANCH}" != "main" ]]; then
            echo "Update cycle ${CYCLE_CONCLUSION} on ${CYCLE_BRANCH}: no audit."; out "run=false"; exit 0
          fi
          hour="$(TZ=Europe/Vienna date +%-H)"
          today="$(TZ=Europe/Vienna date +%F)"
          if (( hour < KI_WAECHTER_START_HOUR )); then
            echo "${hour}:xx Vienna time, audit starts at ${KI_WAECHTER_START_HOUR}:00."; out "run=false"; exit 0
          fi
          last="$(gh api "repos/${OWNER_REPO}/contents/data/side_steps/ki-waechter.json?ref=main" \
                    -H "Accept: application/vnd.github.raw" 2>/dev/null \
                  | jq -r '.steps["KI-Wächter"].at // empty' 2>/dev/null || true)"
          if [[ -n "${last}" && "$(TZ=Europe/Vienna date -d "${last}" +%F)" == "${today}" ]]; then
            echo "Today's audit already ran (${last})."; out "run=false"; exit 0
          fi
          out "run=true"

  audit:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rev: ${{ fromJSON(needs.gate.outputs.revs) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLISH: ${{ needs.gate.outputs.publish }}
      REV: ${{ matrix.rev }}
      WORK: .ki-waechter
    steps:
      # Workaround for actions/checkout#2351, as in the other workflows. The
      # branch tip (``ref``), not the trigger commit: this run publishes.
      - name: Check out repository (attempt 1/2)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
        continue-on-error: true

      - name: Check out repository (attempt 2/2 — runs only if attempt 1 hit checkout#2351)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Claude Code
        shell: bash
        run: npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Prepare the input
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REV}" != "HEAD" ]]; then git fetch --quiet --depth=1 origin "${REV}"; fi
          python scripts/ki_waechter.py prepare --rev "${REV}" --out "${WORK}"

      - name: Claude reads and compares
        id: ai
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "::error title=KI-Wächter::CLAUDE_CODE_OAUTH_TOKEN ist leer"; exit 1
          fi
          prompt="$(sed "s|{EINGABE}|${WORK}/eingabe.md|" scripts/ki_waechter_prompt.md)"
          claude -p "${prompt}" \
            --model "${KI_WAECHTER_MODEL}" \
            --output-format json \
            --max-turns 40 \
            --allowedTools "Read" "Grep" "Glob" \
            --disallowedTools "Bash" "Edit" "Write" "NotebookEdit" "WebFetch" "WebSearch" "Task" \
            > "${WORK}/claude.json"
          jq -r '"Claude: \(.subtype), \(.num_turns) Schritte, \(.duration_ms / 1000 | floor) s"' "${WORK}/claude.json"

      - name: Check every finding and write the audit file
        id: verify
        if: steps.ai.outcome == 'success'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          report="${WORK}/bericht.md"
          if [[ "${PUBLISH}" == "true" ]]; then
            report="docs/archive/audits/ki-waechter-$(TZ=Europe/Vienna date +%F).md"
          fi
          python scripts/ki_waechter.py verify --dir "${WORK}" --claude-output "${WORK}/claude.json" \
            --model "${KI_WAECHTER_MODEL}" --run-url "${RUN_URL}" --report "${report}"
          echo "report=${report}" >> "$GITHUB_OUTPUT"
          cat "${report}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ki-waechter-${{ strategy.job-index }}
          path: ${{ env.WORK }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Record side-step outcome
        if: env.PUBLISH == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          AI_OUTCOME: ${{ steps.ai.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          outcome=failure
          if [[ "${AI_OUTCOME}" == "success" && "${VERIFY_OUTCOME}" == "success" ]]; then outcome=success; fi
          python scripts/record_side_steps.py --state data/side_steps/ki-waechter.json "KI-Wächter=${outcome}"

      # Publish through ``scripts/publish_to_main.sh``, the one publish path
      # of every workflow that writes to ``main``: a plain push, never a
      # force, 4 attempts with rebase. Only the audit file and the record.
      - name: Publish the audit file
        if: env.PUBLISH == 'true'
        env:
          REPORT: ${{ steps.verify.outputs.report }}
        shell: bash
        run: >-
          bash scripts/publish_to_main.sh --strict --label ki-waechter
          --message "docs: KI-Wächter $(TZ=Europe/Vienna date +%d.%m.%Y) [skip ci]"
          -- ${REPORT:+"$REPORT"} data/side_steps/ki-waechter.json

      - name: Open an issue for findings
        if: env.PUBLISH == 'true' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.verify.outputs.report }}
          OWNER_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(jq -r '.funde' "${WORK}/ergebnis.json")"
          if [[ "${count}" == "0" ]]; then echo "Keine Funde."; exit 0; fi
          gh label create ki-waechter --repo "${OWNER_REPO}" --color 5319e7 \
            --description "Fund des täglichen KI-Wächters" 2>/dev/null || true
          {
            echo "Der KI-Wächter fand heute ${count} belegte Fund(e) im Feed:"
            echo
            jq -r '.titel[] | "- " + .' "${WORK}/ergebnis.json"
            echo
            echo "Bericht mit Zitaten: [${REPORT}](${GITHUB_SERVER_URL}/${OWNER_REPO}/blob/main/${REPORT})"
            echo
            echo "Jedes Zitat wurde wörtlich gegen Feed und Quelle geprüft. Der Feed blieb unverändert."
          } > "${WORK}/issue.md"
          gh issue create --repo "${OWNER_REPO}" --label ki-waechter \
            --title "KI-Wächter $(TZ=Europe/Vienna date +%d.%m.%Y): ${count} Fund(e)" --body-file "${WORK}/issue.md"

      - name: Fail the run when the audit could not run
        if: steps.ai.outcome != 'success' || steps.verify.outcome != 'success'
        env:
          AI_OUTCOME: ${{ steps.ai.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          echo "::error title=KI-Wächter::Prüfung nicht gelaufen (Claude: ${AI_OUTCOME}, Prüfung: ${VERIFY_OUTCOME:-nicht gestartet})"
          exit 1
