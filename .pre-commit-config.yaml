# Run `pre-commit install` once after cloning to enable these hooks.
# Run `pre-commit run --all-files` to check the whole repo manually.
#
# Ruff, mypy, bandit and the project's own checks use language: system
# so they run the exact versions installed in the contributor's venv
# from requirements-dev.txt, the versions CI installs; Dependabot keeps
# that one file current. Only the basic hygiene hooks pin an upstream
# release tag here.
default_language_version:
  python: python3.11

repos:
  # ── basic hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # A file a program writes belongs to that program: the hook would
        # only change a byte the next run writes again, and on the minified
        # assets the drift check below then fails. Machine-written are
        # cache/ and data/ (except the READMEs), the feeds, sitemap,
        # llms.txt, statistics and station reports in docs/, the minified
        # site assets and the test fixtures; the audit archive (Jules, the
        # KI-Wächter, earlier reports) stays as written. Until 2026-11-01
        # only docs/feed.xml, docs/sitemap.xml, the JSON files in cache/
        # and data/ and the test fixtures were listed, and
        # ``pre-commit run --all-files`` failed on main.
        exclude: &machine_written '^(cache/|data/(?!(.*/)?README\.md$)|tests/fixtures/|docs/archive/audits/|docs/assets/[^/]+\.min\.(css|js)$|docs/(feed[^/]*\.xml|sitemap\.xml|llms\.txt|stats-summary\.json|statistik[^/]*\.md|stations_validation_report\.md|stations_diff\.md)$)'
      - id: end-of-file-fixer
        exclude: *machine_written
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(cache/.*|data/.*\.json)$
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # ── ruff (linter, includes the bugbear / security rules already
  #    selected via pyproject.toml: E, F, S, B, UP) ─────────────────
  # Until 2026-11-01 this hook pinned ruff-pre-commit v0.4.7 while CI ran
  # ruff 0.17.3 from requirements-dev.txt: two pins, and Dependabot only
  # moves the one in requirements-dev.txt.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python -m ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

  # ── mypy --strict (uses the venv installation so the version and
  #    plugins match exactly what CI runs) ──────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: python -m mypy
        language: system
        types: [python]
        # mypy's pyproject.toml config drives file selection; we let
        # mypy itself walk src/, tests/ and scripts/ (``files``, the
        # scope mypy-strict.yml checks) rather than pass each staged
        # file individually (which would miss cross-module type errors).
        pass_filenames: false
        require_serial: true

  # ── scan for accidentally committed secrets ──────────────────────
  - repo: local
    hooks:
      - id: scan-secrets
        name: scan for accidentally committed secrets
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: false
        require_serial: true

  # ── bandit security SAST (matches CI's bandit job) ──────────────
  # Shift-left for the bandit gate so contributors catch B-class
  # issues before pushing instead of discovering them in CI.
  # ``-q`` suppresses non-error output; ``-r src scripts`` matches
  # ``run_static_checks.py``'s invocation exactly, and like that run it
  # uses the venv's bandit (until 2026-11-01 a second pin, rev 1.9.4).
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: python -m bandit -r src scripts -q
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # ── C901 complexity gate (matches CI's complexity-gate workflow) ─
  # Allowlist-style baseline check over src/ and scripts/: fails when the
  # McCabe complexities above 15 differ from ``.c901-baseline.txt`` in
  # any way (a new function above 15, a baselined one that got more
  # complex, simpler or dropped to 15 or less) or when ruff cannot
  # measure. After a refactor, lock the new values in with
  # ``bash scripts/regen_c901_baseline.sh``.
  - repo: local
    hooks:
      - id: c901-baseline
        name: C901 complexity gate (max 15 for new code)
        entry: python scripts/check_complexity.py
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]

  # ── Static-site asset drift check ────────────────────────────────
  # docs/assets/site.min.css and docs/assets/site.min.js are derived
  # from their readable sources (site.css / site.js); the dashboard's
  # docs/site.html references the minified copies and carries a
  # content-hash ``?v=`` cache-bust token per reference. This hook fails
  # if the committed bundles fall out of sync with the source OR the
  # ``?v=`` tokens in site.html no longer match the bundle hashes — the
  # fix is to re-run ``python scripts/optimize_site_assets.py
  # --skip-images`` and stage the regenerated bundles + site.html.
  - repo: local
    hooks:
      - id: site-assets-minified
        name: docs/assets/site.min.* matches source
        entry: python scripts/optimize_site_assets.py --check
        language: system
        files: ^docs/(site\.html|assets/site\.(css|js|min\.css|min\.js))$
        pass_filenames: false
        require_serial: true

  # ── Dashboard i18n coverage gate ─────────────────────────────────
  # Every ``data-i18n*`` attribute in docs/site.html must have a
  # matching key in the ``I18N_EN`` dictionary in docs/assets/site.js.
  # The pre-commit hook rejects drift the moment a new German UI
  # string is added to the HTML without an English equivalent — that
  # was the exact failure mode behind the partially-translated
  # dashboard (section headings + footer were never registered).
  - repo: local
    hooks:
      - id: i18n-coverage
        name: docs/site.html data-i18n keys covered by I18N_EN
        entry: python scripts/check_i18n_coverage.py
        language: system
        files: ^docs/(site\.html|assets/site\.js)$
        pass_filenames: false
        require_serial: true
